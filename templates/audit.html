{% extends "base.html" %}{% block t %}Audit Trail{% endblock %}{% block body %}

<div class="card"><table>
<tr><th>#</th><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr>

{% endblock %}
